[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "PNASystems_CRP"
version = "0.1.0"
description = "PNASystems CRP — Raspberry Pi 4/5 remote (headless + desktop)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["cryptography>=41", "pnasys-encryption-service>=1.12"]
authors = [{name="PNASystems"}]

[project.scripts]
pnasyscrp = "pnasystems_crp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
